volumes:
  qr-state:
  qr-caddy-data:
  qr-caddy-config:

services:
  qr-web:
    profiles: [qr-dry-run]
    build:
      context: .
      dockerfile: Dockerfile.qr
    restart: unless-stopped
    environment:
      INVENTREE_SITE_URL: http://inventree-server:8000
      INVENTREE_API_TOKEN: ${INVENTREE_API_TOKEN:-}
      QR_USERNAME: ${QR_USERNAME:-}
      QR_PASSWORD: ${QR_PASSWORD:-}
      OPEN_PO_ID: "1"
      QR_QUANTITY: "10"
      # Intentionally fixed; root .env cannot enable live writes.
      QR_DRY_RUN: "true"
      QR_DATABASE: /state/qr_requests.sqlite3
    volumes:
      - qr-state:/state
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  qr-proxy:
    profiles: [qr-dry-run]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${QR_BIND_IP:-10.20.225.77}:8443:8443"
    environment:
      QR_BIND_IP: ${QR_BIND_IP:-10.20.225.77}
    volumes:
      - ./deploy/Caddyfile.qr:/etc/caddy/Caddyfile:ro
      - qr-caddy-data:/data
      - qr-caddy-config:/config
    depends_on:
      qr-web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  # PostgreSQL Database
  inventree-db:
    image: postgres:16
    container_name: inventree-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${INVENTREE_DB_USER}
      - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD}
      - POSTGRES_DB=${INVENTREE_DB_NAME}
    volumes:
      - ${INVENTREE_EXT_VOLUME}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTREE_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  inventree-cache:
    image: redis:7-alpine
    container_name: inventree-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InvenTree Webserver
  inventree-server:
    image: inventree/inventree:${INVENTREE_TAG}
    container_name: inventree-server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data
    depends_on:
      inventree-db:
        condition: service_healthy
      inventree-cache:
        condition: service_healthy

  # InvenTree Achtergrond-worker 
  inventree-worker:
    image: inventree/inventree:${INVENTREE_TAG}
    container_name: inventree-worker
    command: invoke worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data
    depends_on:
      - inventree-server

  # Caddy Reverse Proxy 
  inventree-proxy:
    image: caddy:2-alpine
    container_name: inventree-proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - INVENTREE_SITE_URL=${INVENTREE_SITE_URL}
    volumes:
      - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:ro
      - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - inventree-server
